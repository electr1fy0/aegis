[project]
name = "aegis-coordination"
version = "0.1.0"
description = "Evidence-backed incident coordination for synthetic campus exercises"
requires-python = ">=3.14"
dependencies = ["fastapi>=0.120", "pydantic>=2.12", "uvicorn>=0.38"]

[project.optional-dependencies]
semantic = ["sentence-transformers>=5"]

[dependency-groups]
dev = ["pytest>=9", "pytest-cov>=7", "httpx>=0.28", {include-group = "lint"}]
lint = ["ruff==0.17.2"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]
addopts = "-ra --strict-markers --strict-config"

[tool.coverage.run]
branch = true
source = ["backend/aegis", "data"]

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_empty = true
precision = 2

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF"]

[tool.ruff.lint.per-file-ignores]
"backend/tests/*" = ["E501"]
