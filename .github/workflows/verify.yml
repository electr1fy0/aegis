name: Verify

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.12.17"
          python-version: "3.14"
          enable-cache: true
          cache-dependency-glob: "requirements*.lock"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.2"
      - name: Install locked dependencies
        run: |
          uv venv --python 3.14 .venv
          uv pip sync --python .venv/bin/python requirements-dev.lock
          cd frontend
          bun install --frozen-lockfile
      - name: Test every source coverage gate and build
        run: make verify
      - name: Audit locked dependencies
        run: |
          uvx --from pip-audit==2.10.1 pip-audit -r requirements-dev.lock --no-deps --disable-pip
          cd frontend
          bun audit
      - name: Install browser
        working-directory: frontend
        run: bunx playwright install --with-deps chromium
      - name: Browser smoke tests
        working-directory: frontend
        run: bun run e2e
